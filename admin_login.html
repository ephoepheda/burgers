<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAGER LOGIN | QUEEN BURGER 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d14 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 32px;
            width: 400px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            animation: fadeIn 1s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 2rem;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .login-logo span { color: var(--primary); }
        
        .login-subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .login-btn {
            width: 100%;
            background: var(--gradient-brand);
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(255,81,43,0.3);
        }
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,81,43,0.5);
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 25px;
        }
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }
        .login-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 16px 20px 16px 55px;
            border-radius: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-align: center;
        }
        .login-input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(255,81,43,0.15);
        }

        #loginError {
            color: #ff4757;
            font-size: 0.8rem;
            margin-top: 15px;
            font-weight: 700;
            display: none;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-10px); }
            40%      { transform: translateX(10px); }
            60%      { transform: translateX(-8px); }
            80%      { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">QUEEN <span>BURGER</span></div>
        <div class="login-subtitle">Manager Dashboard Access</div>

        <form id="managerLoginForm">
            <div class="input-wrapper">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <input type="password" id="managerCode" class="login-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="login-btn">ENTER DASHBOARD</button>
            <div id="loginError">Invalid credentials. Access Denied.</div>
        </form>

        <p style="margin-top:40px; font-size:11px; color:rgba(255,255,255,0.2);">
            AUTHORIZED PERSONNEL ONLY
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="admin_auth.js"></script>
    <script>
        // Check if already logged in
        adminAuth.checkAuth();

        document.getElementById('managerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('managerCode').value;
            const success = adminAuth.login(code);

            if (success) {
                await Swal.fire({
                    title: '🔓 Access Granted',
                    html: `
                        <div style="font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:6px;">Welcome back, Manager.</div>
                        <div style="background:rgba(46,204,113,0.12); border:1px solid rgba(46,204,113,0.3); border-radius:10px; padding:10px 14px; margin-top:10px; font-size:0.82rem; color:#2ecc71; font-family:monospace; letter-spacing:2px;">
                            ${code}
                        </div>`,
                    icon: 'success',
                    timer: 2000,
                    timerProgressBar: true,
                    showConfirmButton: false,
                    background: '#1a1a2e',
                    color: '#fff'
                });
                location.href = 'admin.html';
            } else {
                // Wrong password — SweetAlert error
                await Swal.fire({
                    title: '🚫 Access Denied',
                    text: 'Invalid manager code. Please try again.',
                    icon: 'error',
                    confirmButtonText: 'Try Again',
                    confirmButtonColor: '#ff4757',
                    background: '#1a1a2e',
                    color: '#fff'
                });

                // Shake animation + clear field
                document.getElementById('managerCode').value = '';
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                card.offsetHeight; // force reflow
                card.style.animation = 'shake 0.4s ease-in-out';
                setTimeout(() => { card.style.animation = ''; }, 400);
            }
        });
    </script>
</body>
</html>
