<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FELLOWS PANEL | QUEEN BURGER 🛵</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .panel-container { max-width: 800px; margin: 100px auto; padding: 0 20px; }
        .order-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 24px; margin-bottom: 20px; transition: var(--transition); }
        .order-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .order-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .order-id { font-family: var(--font-display); font-weight: 800; color: var(--primary); font-size: 1.2rem; }
        .order-status { text-transform: uppercase; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); }
        .status-preparing { color: #ff9f43; background: rgba(255,159,67,0.1); }
        .status-delivery { color: var(--primary); background: rgba(255,81,43,0.1); }
        .status-delivered { color: #2ecc71; background: rgba(46,204,113,0.1); }
        
        .customer-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; font-size: 14px; }
        .info-label { display: block; color: var(--text-muted); font-size: 11px; text-transform: uppercase; margin-bottom: 3px; font-weight: 700; }
        
        .action-row { margin-top: 20px; display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: var(--transition); }
        .btn-update { background: var(--primary); color: white; }
        .btn-update:hover { background: #e64523; transform: scale(1.02); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">FELLOWS <span>PANEL</span></div>
            <div class="nav-actions">
                <span id="userName" style="color:white; font-weight:700; margin-right:20px; font-size:14px;">Fellow Rider</span>
                <button class="btn btn-primary" onclick="auth.logout()" style="padding:8px 20px; font-size:12px;">LOGOUT</button>
            </div>
        </div>
    </header>

    <div class="panel-container">
        <div style="background: linear-gradient(135deg, var(--bg-card), rgba(255,81,43,0.1)); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,81,43,0.2); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-size: 12px; text-transform: uppercase; color: var(--primary); font-weight: 800; letter-spacing: 1px; margin-bottom:5px;">Total Earnings 💵</div>
                <div id="riderEarnings" style="font-family: var(--font-display); font-size: 2.8rem; font-weight: 900; color: white;">0 ETB</div>
            </div>
            <div style="text-align: right; background: rgba(0,0,0,0.2); padding: 15px 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">Completed Deliveries</div>
                <div id="riderDeliveryCount" style="font-size: 1.8rem; font-weight: 800; color: #2ecc71;">0</div>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="font-family:var(--font-display); font-weight:800;">My Deliveries</h2>
            <div id="refresh-indicator" style="font-size:12px; color:var(--text-muted);"><span style="color:var(--primary);">●</span> Real-time Sync Active</div>
        </div>

        <div id="delivery-orders">
            <!-- Orders Injected via JS -->
            <div style="text-align:center; margin-top:100px;">
                <div style="width:40px; height:40px; border:3px solid rgba(255,255,255,0.05); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div>
                <p style="color:var(--text-muted); font-size:14px;">Connecting to fleet database...</p>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="auth_delivery.js"></script>
    <script src="delivery_panel.js"></script>
    <script>
        // Check authentication immediately
        const user = auth.checkAuth();
        if (user) document.getElementById('userName').innerText = user.name;
    </script>
</body>
</html>
