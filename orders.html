<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEEN BURGER | My Orders 📦</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-container { display: flex; justify-content: space-between; position: relative; margin-top: 30px; margin-bottom: 30px; padding: 0 10px; }
        .progress-line { position: absolute; top: 15px; left: 10%; right: 10%; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
        .progress-fill { position: absolute; top: 15px; left: 10%; height: 2px; background: var(--primary); z-index: 2; transition: 0.8s cubic-bezier(0.85, 0, 0.15, 1); width: 0%; }
        .progress-step { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; }
        .step-icon { width: 32px; height: 32px; background: #222; border: 2px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.4s; }
        .step-label { font-size: 10px; text-transform: uppercase; font-weight: 800; color: #555; font-family: var(--font-display); text-align: center; }
        .progress-step.active .step-icon { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 81, 43, 0.5); transform: scale(1.2); }
        .progress-step.active .step-label { color: var(--primary); }
        .whatsapp-btn { display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-size: 12px; font-weight: 700; transition: 0.3s; margin-top: 15px; }
        .whatsapp-btn:hover { background: #128C7E; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="nav-container">
            <div class="logo" onclick="location.href='index.html'">QUEEN <span data-i18n="logo_burger">BURGER</span></div>
            
            <div class="nav-actions" style="margin-left: auto;">
                <!-- Language Switcher -->
                <div class="lang-switch" onclick="app.toggleLanguage()" style="cursor:pointer; margin-right:20px; display:flex; align-items:center; gap:8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                    <span id="currentLang" style="font-weight:700; font-size:14px;">EN</span>
                </div>

                <div class="nav-orders-wrap" id="navOrdersBtn" onclick="location.href='orders.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.29 7 12 12l8.71-5"/><path d="M12 22V12"/></svg>
                    <span style="font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;" data-i18n="nav_orders">Orders</span>
                    <span class="cart-reminder-badge" id="navOrdersBadge"></span>
                </div>
                
                <button class="btn btn-primary" onclick="location.href='menu.html'" style="padding: 10px 20px; font-size: 12px; margin-left: 10px;" data-i18n="royal_selection">Back to Menu</button>
            </div>
        </div>
    </header>

    <!-- ORDER HISTORY SECTION -->
    <section id="orders" style="padding: 120px 0 100px;">
        <div class="section-title" data-i18n="my_orders">My Orders</div>
        <div class="order-history-container" id="order-history-list" style="max-width: 800px; margin: 0 auto; padding: 0 20px;">
            <!-- Orders Injected via JS -->
            <div style="text-align:center; padding:100px 0; color:var(--text-muted);">
                <div style="font-size:4rem; margin-bottom:20px;">📦</div>
                <p>Loading your status pulse...</p>
            </div>
        </div>
    </section>

    <!-- BOTTOM NAVIGATION (MOBILE ONLY) -->
    <nav class="bottom-nav">
        <div class="b-nav-item" onclick="location.href='index.html'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span style="font-size:10px; font-weight:800;">HOME</span>
        </div>
        <div class="b-nav-item" onclick="location.href='menu.html'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M3.6 15h16.8"/><path d="M3.6 9h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></svg>
            <span style="font-size:10px; font-weight:800;">MENU</span>
        </div>
        <div class="b-nav-item active" onclick="location.href='orders.html'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            <span style="font-size:10px; font-weight:800;" data-i18n="nav_orders">Orders</span>
        </div>
        <div class="b-nav-item" onclick="app.toggleLanguage()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span id="currentLangBottom" style="font-size:10px; font-weight:800;">EN</span>
        </div>
    </nav>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script>
        // Update bottom nav lang label on change
        window.addEventListener('languageChanged', (e) => {
            const label = document.getElementById('currentLangBottom');
            if (label) label.innerText = e.detail.toUpperCase();
        });
    </script>
</body>
</html>
